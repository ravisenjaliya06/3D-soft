image: python:3.11

stages:
  - test
  - check
  - coverage

variables:
  PIPENV_VENV_IN_PROJECT: "true"
  PIPENV_NOSPIN: "true"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never

backend_ci:
  stage: test
  script:
    - pip install pipenv
    - cd backend
    - pipenv install --dev --deploy --ignore-pipfile
    - chmod +x scripts/type-checker.sh
    - ./scripts/type-checker.sh
  rules:
    - changes:
        - backend/**/*

backend_formatter:
  stage: check
  script:
    - cd backend
    - chmod +x scripts/formatter.sh
    - ./scripts/formatter.sh
  rules:
    - changes:
        - backend/**/*

backend_migrations:
  stage: check
  script:
    - cd backend
    - chmod +x scripts/check_migrations.sh
    - ./scripts/check_migrations.sh
  rules:
    - changes:
        - backend/**/*

backend_tests:
  stage: test
  script:
    - cd backend
    - pipenv run coverage run -m pytest
  rules:
    - changes:
        - backend/**/*

backend_coverage:
  stage: coverage
  script:
    - cd backend
    - pipenv run coverage report -m
    - |
      coverage_percentage=$(pipenv run coverage report | grep TOTAL | awk '{print $NF}' | sed 's/%//')
      if (( $(echo "$coverage_percentage < 90" | bc -l) )); then
        echo "Coverage is below 90%: $coverage_percentage%. Please add more tests to improve coverage."
        exit 1
      else
        echo "Coverage is sufficient: $coverage_percentage%."
      fi
  rules:
    - changes:
        - backend/**/*

  coverage: '/TOTAL.+ ([0-9]{1,3}%)/' 
