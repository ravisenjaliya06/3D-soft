<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bravento Admin</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    {% load static %}
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'custom_admin/style.css' %}">
</head>

<body>
    <div class="login-container">
        <div class="login-card glass-effect shadow-premium">
            <div class="text-center mb-4">
                <img src="{% static 'custom_admin/assets/logo-login.svg' %}" alt="Bravento Logo" class="mb-4"
                    style="max-height: 3.75rem;">
                <h3 class="fw-bold text-dark">Welcome Back</h3>
                <p class="text-muted small">Sign in to access your dashboard</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold text-muted">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 border-muted text-muted"><i
                                class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control form-control-custom border-start-0 ps-0" id="email"
                            placeholder="name@company.com" required>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold text-muted">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 border-muted text-muted"><i
                                class="bi bi-key"></i></span>
                        <input type="password" class="form-control form-control-custom border-start-0 ps-0"
                            id="password" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary border-start-0 border-muted bg-white text-muted"
                            type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                        <div class="invalid-feedback">Password is required.</div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2">
                    Sign In <i class="bi bi-arrow-right ms-2"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Script -->
    <script src="{% static 'custom_admin/script.js' %}"></script>
    <script>
        // Override Login Logic
        const loginForm = document.getElementById('loginForm');
        // Remove existing listener by cloning (simplest way without reference to original function)
        const newLoginForm = loginForm.cloneNode(true);
        loginForm.parentNode.replaceChild(newLoginForm, loginForm);

        newLoginForm.addEventListener('submit', function (event) {
            event.preventDefault();
            event.stopPropagation();

            if (newLoginForm.checkValidity()) {
                const btn = newLoginForm.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Signing In...';
                btn.disabled = true;

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                // Get CSRF Token
                function getCookie(name) {
                    let cookieValue = null;
                    if (document.cookie && document.cookie !== '') {
                        const cookies = document.cookie.split(';');
                        for (let i = 0; i < cookies.length; i++) {
                            const cookie = cookies[i].trim();
                            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                                break;
                            }
                        }
                    }
                    return cookieValue;
                }
                const csrftoken = getCookie('csrftoken');

                fetch('{% url "admin_login" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify({ email: email, password: password })
                })
                    .then(response => {
                        if (response.ok) {
                            window.location.href = '{% url "admin_dashboard" %}';
                        } else {
                            btn.innerHTML = originalText;
                            btn.disabled = false;
                            // Show error
                            alert('Login failed. Please check your credentials.');
                        }
                    })
                    .catch(error => {
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                        console.error('Error:', error);
                        alert('An error occurred.');
                    });
            }

            newLoginForm.classList.add('was-validated');
        });

        // Re-attach toggle password logic since we cloned the form
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        if (togglePasswordBtn && passwordInput) {
            togglePasswordBtn.addEventListener('click', function () {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                const icon = this.querySelector('i');
                if (isPassword) {
                    icon.classList.remove('bi-eye');
                    icon.classList.add('bi-eye-slash');
                } else {
                    icon.classList.remove('bi-eye-slash');
                    icon.classList.add('bi-eye');
                }
            });
        }
    </script>
</body>

</html>
