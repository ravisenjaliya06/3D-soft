<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }

        .wrapper {
            width: 100%;
            padding: 40px 0;
            background-color: #f4f7f6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            font-size: 16px;
            line-height: 1.6;
        }

        .header {
            background-color: #392579;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .content {
            padding: 40px 30px;
            text-align: center;
        }

        .content h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 24px;
        }

        .content p {
            margin-bottom: 20px;
            color: #555;
        }

        .email-highlight {
            font-weight: 600;
            color: #392579 !important;
        }

        .button-container {
            margin: 30px 0;
        }

        .button {
            display: inline-block;
            background-color: #392579 !important;
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0px 0.188rem 4rem 0px #bfb6dd !important;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover {
            background-color: #f5e5ff !important;
            color: #392579 !important;
            transform: translateY(-2px);
            border: 1px solid #392579 !important;
            box-shadow: 0px 0.188rem 4rem 0px #bfb6dd !important;
        }

        .footer {
            background-color: #f9f9f9;
            padding: 20px;
            text-align: center;
            font-size: 13px;
            color: #888;
            border-top: 1px solid #eee;
        }

        .footer a {
            color: #392579;
            text-decoration: none;
        }

        .footer p {
            margin: 5px 0;
        }

        @media only screen and (max-width: 600px) {
            .container {
                width: 90%;
                margin: 20px auto;
            }

            .content {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <h1>Bravento</h1>
            </div>
            <div class="content">
                <h2>Forgot your password?</h2>
                <p>Hello, <span class="email-highlight">{{ email }}</span></p>
                <p>We received a request to reset your password. If you didn't ask for this, you can safely ignore this
                    email.</p>
                <div class="button-container">
                    <a href="{{ server_url }}/user/set_password/{{ token }}/" class="button">Reset Password</a>
                </div>
                <p style="font-size: 14px; color: #777;">The link is valid for 24 hours.</p>
            </div>
            <div class="footer">
                <p>&copy; Bravento Team</p>
                <p>By clicking the button you agree to our <a href="#">Terms & Conditions</a>.</p>
            </div>
        </div>
    </div>
</body>

</html>
