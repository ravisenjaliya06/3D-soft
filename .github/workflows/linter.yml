name: Backend CI (Test, TypeCheck, Format)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - 'backend/**'

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  ci-backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            backend
            !backend/umaboy/media
          sparse-checkout-cone-mode: false
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pipenv'
          cache-dependency-path: './backend/Pipfile.lock'

      - name: Install Pipenv & Dependencies
        run: |
          pip install pipenv
          pipenv install --dev --deploy --ignore-pipfile

      - name: Run Type Checker (Mypy/Pyright)
        run: |
          chmod +x scripts/type-checker.sh
          ./scripts/type-checker.sh

      - name: Run Formatter Check (Black/Isort)
        run: |
          chmod +x scripts/formatter.sh
          ./scripts/formatter.sh
          # Note: If this fails, the script should exit with non-zero code

      - name: Run Migrations Checker
        run: |
          chmod +x scripts/check_migrations.sh
          ./scripts/check_migrations.sh
          if [ $? -ne 0 ]; then
             echo "❌ Migration Issue: Ensure only one migration file exists per app."
             exit 1
          fi

      - name: Run Pytest
        env:
          SECRET_KEY: 'testing-secret-key'
        run: |
          pipenv run coverage run -m pytest

      - name: Check Code Coverage
        id: coverage
        run: |
          pipenv run coverage report
          
          # Extract percentage number
          coverage_percentage=$(pipenv run coverage report | grep TOTAL | awk '{print $NF}' | sed 's/%//')
          
          echo "Current Coverage: $coverage_percentage%"
          
          # Logic: Fail if coverage is below 70%
          if (( $(echo "$coverage_percentage < 70" | bc -l) )); then
            echo "❌ Coverage is too low: $coverage_percentage% (Threshold: 70%)"
            echo "Please add more tests."
            exit 1
          else
            echo "✅ Coverage is sufficient: $coverage_percentage%."
          fi

      - name: Notify Google Chat
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS_MSG="✅ Backend Validation Passed"
          else
            STATUS_MSG="❌ Backend Validation Failed"
          fi

          AUTHOR="${{ github.event.pull_request.user.login }}"
          BRANCH="${{ github.head_ref }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          REPO="${{ github.repository }}"

          # We use a variable to avoid escaping hell
          TEXT_CONTENT="*$STATUS_MSG*\n\n👤 *Author:* $AUTHOR\n🌿 *Branch:* $BRANCH\n📂 *Repo:* $REPO\n🔗 <$PR_URL|View Pull Request>"

          # Single quotes around the URL are CRITICAL to protect the &token= part
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"text\": \"$TEXT_CONTENT\"}" \
            '${{ secrets.GOOGLE_CHAT_WEBHOOK }}'
