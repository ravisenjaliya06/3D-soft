name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  backend:
    name: Run Backend Checks
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      - name: Install Pipenv
        run: pip install pipenv
      - name: Install Dependencies
        working-directory: ./backend
        run: pipenv install --dev --deploy --ignore-pipfile
      - name: Type Check
        working-directory: ./backend
        run: ./backend/scripts/type-checker.sh
      - name: Formatter Check
        working-directory: ./backend
        run: ./backend/scripts/formatter.sh
      - name: Migration Check
        working-directory: ./backend
        run: ./backend/scripts/check_migrations.sh
      - name: Run Tests & Coverage
        working-directory: ./backend
        run: |
          pipenv run coverage run -m pytest
          coverage_percentage=$(pipenv run coverage report | grep TOTAL | awk '{print $NF}' | sed 's/%//')
          if (( $(echo "$coverage_percentage < 90" | bc -l) )); then
            echo "Coverage below 90%: $coverage_percentage%"
            exit 1
          fi
