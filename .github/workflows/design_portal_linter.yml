name: Design Portal Linter

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
    paths:
      - 'design_portal/**'

jobs:
  lint:
    name: Lint Frontend Code
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Frontend Dependencies
        working-directory: ./design_portal
        run: |
          npm install

      - name: Run Frontend Linter
        working-directory: ./design_portal
        run: |
          npm run lint  # Run the ESLint linter
          if [ $? -ne 0 ]; then
            echo "Design_portal linting failed. Please fix the linting issues."
            exit 1  # Fail the job if there are linting issues
          fi

      - name: Run Frontend Formatter Check
        working-directory: ./design_portal
        run: |
          npm run format  # Run the Prettier formatter
          if [ $? -ne 0 ]; then
            echo "Design_portal formatter check failed. Please fix the formatting issues."
            exit 1  # Fail the job if there are formatting issues
          fi

      - name: Build Next.js
        working-directory: ./design_portal
        run: |
          npm run build
          if [ $? -ne 0 ]; then
            echo "Design_portal build failed. Please fix the build issues."
            exit 1  # Fail the job if there are build issues
          fi
