name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'design_portal/**'

jobs:
  frontend:
    name: Lint, Format & Build Frontend
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        working-directory: ./design_portal
        run: npm install
      - name: Lint & Format
        working-directory: ./design_portal
        run: |
          npm run lint
          npm run format
      - name: Build
        working-directory: ./design_portal
        run: npm run build
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: ./design_portal/.next
