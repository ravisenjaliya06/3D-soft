name: Design Portal CI (Lint, Format, Build)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - 'design_portal/**'

jobs:
  lint-frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./design_portal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: npm install

      - name: Run Linter (ESLint)
        run: |
          npm run lint
          # Note: npm run lint usually exits with 1 on error automatically

      - name: Run Formatter Check (Prettier)
        run: |
          # Ideally, run 'prettier --check .' so it doesn't just write files but fails if unformatted
          npm run format || { echo "❌ Prettier check failed"; exit 1; }

      - name: Build Next.js Application
        run: |
          npm run build || { echo "❌ Next.js Build failed"; exit 1; }

      - name: Notify Google Chat
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS_MSG="✅ Frontend Validation Passed"
          else
            STATUS_MSG="❌ Frontend Validation Failed"
          fi

          AUTHOR="${{ github.event.pull_request.user.login }}"
          BRANCH="${{ github.head_ref }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          REPO="${{ github.repository }}"

          # We use a variable to avoid escaping hell
          TEXT_CONTENT="*$STATUS_MSG*\n\n👤 *Author:* $AUTHOR\n🎨 *Project:* Design Portal\n🌿 *Branch:* $BRANCH\n📂 *Repo:* $REPO\n🔗 <$PR_URL|View Pull Request>"

          # Single quotes around the URL are CRITICAL to protect the &token= part
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"text\": \"$TEXT_CONTENT\"}" \
            '${{ secrets.GOOGLE_CHAT_WEBHOOK }}'
